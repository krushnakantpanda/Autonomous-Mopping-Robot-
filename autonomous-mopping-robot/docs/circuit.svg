<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="780" viewBox="0 0 1180 780">
<rect width="1180" height="780" fill="#f8fafc"/><text x="42" y="46" font-family="Arial" font-size="28" font-weight="bold" fill="#14213d">Arduino Uno Autonomous Mopper — circuit overview</text><text x="42" y="76" font-family="Arial" font-size="15" fill="#475569">Conceptual system wiring. Match carrier labels and module datasheets; verify supply voltages before connecting.</text>
<g font-family="Arial" stroke="#334155" stroke-width="2" fill="#14213d">
<rect x="65" y="145" width="260" height="240" rx="12" fill="#dbeafe"/><text x="112" y="181" font-size="23" font-weight="bold" stroke="none">Arduino Uno</text><text x="90" y="218" font-size="15" stroke="none">D5/D6 PWM; D7-D10 direction</text><text x="90" y="243" font-size="15" stroke="none">D4 STBY; D3 servo signal</text><text x="90" y="268" font-size="15" stroke="none">D11/D12 HC-SR04 ECHO/TRIG</text><text x="90" y="293" font-size="15" stroke="none">A0/A1 cliff; A2/A3 bumpers</text><text x="90" y="318" font-size="15" stroke="none">D2 MOSFET gate input</text><text x="90" y="355" font-size="14" font-weight="bold" stroke="none">5V logic; shared GND</text>
<rect x="430" y="145" width="250" height="145" rx="12" fill="#dcfce7"/><text x="482" y="183" font-size="22" font-weight="bold" stroke="none">TB6612FNG</text><text x="466" y="216" font-size="15" stroke="none">VCC = 5 V logic</text><text x="466" y="241" font-size="15" stroke="none">VM = regulated 6 V motors</text><text x="466" y="266" font-size="15" stroke="none">A01/A02 and B01/B02</text>
<rect x="815" y="130" width="285" height="95" rx="12" fill="#ffedd5"/><text x="861" y="169" font-size="20" font-weight="bold" stroke="none">Left + Right DC motors</text><text x="866" y="198" font-size="14" stroke="none">Differential drive • 6 V rail</text>
<rect x="430" y="355" width="250" height="130" rx="12" fill="#fce7f3"/><text x="487" y="391" font-size="21" font-weight="bold" stroke="none">Sensors / servo</text><text x="460" y="423" font-size="14" stroke="none">HC-SR04 on pan servo</text><text x="460" y="447" font-size="14" stroke="none">2 analog cliff + 2 bumpers</text><text x="460" y="470" font-size="14" stroke="none">5 V supply; common GND</text>
<rect x="815" y="345" width="285" height="125" rx="12" fill="#ede9fe"/><text x="864" y="384" font-size="21" font-weight="bold" stroke="none">Pump switch</text><text x="842" y="416" font-size="14" stroke="none">D2 → logic-level MOSFET gate</text><text x="842" y="441" font-size="14" stroke="none">Pump via 5 V rail + flyback diode</text>
<rect x="65" y="535" width="260" height="125" rx="12" fill="#fef3c7"/><text x="105" y="575" font-size="20" font-weight="bold" stroke="none">Protected 2S battery</text><text x="104" y="606" font-size="14" stroke="none">Fuse → latching main switch</text><text x="104" y="632" font-size="14" stroke="none">7.4 V nominal / 8.4 V full</text>
<rect x="430" y="550" width="250" height="105" rx="12" fill="#e0e7ff"/><text x="477" y="588" font-size="20" font-weight="bold" stroke="none">Two buck converters</text><text x="469" y="618" font-size="14" stroke="none">6.0 V motor / 5.0 V logic</text><text x="486" y="641" font-size="14" stroke="none">Set with meter first</text>
<rect x="815" y="535" width="285" height="125" rx="12" fill="#fee2e2"/><text x="866" y="574" font-size="20" font-weight="bold" stroke="none">Water system</text><text x="846" y="606" font-size="14" stroke="none">5 V peristaltic pump → damp pad</text><text x="842" y="632" font-size="14" stroke="none">Isolate and elevate all electronics</text>
</g>
<g fill="none" stroke-width="4"><path d="M325 225 H430" stroke="#2563eb"/><path d="M680 210 H815" stroke="#ea580c"/><path d="M325 310 C370 310 382 415 430 415" stroke="#be185d"/><path d="M325 340 C540 340 610 405 815 405" stroke="#7c3aed"/><path d="M325 590 H430" stroke="#ca8a04"/><path d="M555 550 V485" stroke="#16a34a"/><path d="M680 605 H815" stroke="#16a34a"/></g>
<g font-family="Arial" font-size="13" fill="#334155"><text x="344" y="213">PWM + direction + STBY</text><text x="692" y="197">Motor output wires</text><text x="338" y="366">Sensor I/O + 5V</text><text x="685" y="382">MOSFET gate control</text><text x="339" y="575">Battery DC</text><text x="565" y="521">Separate regulated rails</text><text x="694" y="590">Pump power</text></g>
<path d="M70 708 H1100" stroke="#475569" stroke-width="3"/><text x="75" y="739" font-family="Arial" font-size="17" font-weight="bold" fill="#14213d">COMMON GROUND: battery negative, both buck negatives, Uno GND, TB6612 GND, sensors, servo and MOSFET source</text><text x="76" y="682" font-family="Arial" font-size="14" fill="#b91c1c">Never connect pump/motor loads to Uno I/O. External regulated 5 V on Uno 5V pin requires USB disconnected.</text>
</svg>
