<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
<rect width="1000" height="760" fill="#fbfdff"/><text x="45" y="48" font-family="Arial" font-size="28" font-weight="bold" fill="#14213d">Autonomous mopper — top view layout</text><text x="45" y="78" font-family="Arial" font-size="15" fill="#475569">Nominal chassis envelope 280 × 240 mm • adapt holes, component footprints and clearances to your parts</text>
<rect x="190" y="135" width="560" height="480" rx="20" fill="#f1f5f9" stroke="#334155" stroke-width="6"/>
<text x="417" y="160" font-family="Arial" font-size="15" font-weight="bold" fill="#334155">FRONT</text>
<!-- bumper and ultrasonic -->
<rect x="278" y="178" width="384" height="18" rx="7" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/><text x="425" y="174" font-family="Arial" font-size="13" fill="#991b1b">Front bumper strip / switches</text>
<path d="M460 215 Q470 190 480 215" fill="#bae6fd" stroke="#0369a1" stroke-width="3"/><rect x="448" y="204" width="64" height="34" rx="6" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><text x="526" y="226" font-family="Arial" font-size="13" fill="#1e3a8a">HC-SR04 + pan servo</text>
<!-- IR sensors -->
<rect x="270" y="242" width="45" height="26" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="2"/><rect x="625" y="242" width="45" height="26" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="2"/><text x="238" y="288" font-family="Arial" font-size="13" fill="#92400e">Down-facing cliff IR</text><text x="590" y="288" font-family="Arial" font-size="13" fill="#92400e">Down-facing cliff IR</text>
<!-- reservoir and electronics -->
<rect x="345" y="300" width="250" height="115" rx="14" fill="#bae6fd" stroke="#0369a1" stroke-width="3"/><text x="408" y="345" font-family="Arial" font-size="19" font-weight="bold" fill="#0c4a6e">Sealed water tank</text><text x="394" y="374" font-family="Arial" font-size="14" fill="#0c4a6e">Centerline • leak-test first</text>
<rect x="351" y="430" width="240" height="82" rx="10" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/><text x="394" y="465" font-family="Arial" font-size="17" font-weight="bold" fill="#4c1d95">Elevated electronics</text><text x="397" y="489" font-family="Arial" font-size="13" fill="#4c1d95">Uno, driver, buck converters</text>
<!-- motors/wheels -->
<rect x="222" y="390" width="48" height="98" rx="13" fill="#475569"/><rect x="670" y="390" width="48" height="98" rx="13" fill="#475569"/><text x="206" y="510" font-family="Arial" font-size="13" fill="#334155">Drive wheel</text><text x="661" y="510" font-family="Arial" font-size="13" fill="#334155">Drive wheel</text>
<circle cx="470" cy="560" r="21" fill="#cbd5e1" stroke="#475569" stroke-width="3"/><text x="503" y="566" font-family="Arial" font-size="13" fill="#334155">Rear caster</text><circle cx="470" cy="260" r="12" fill="#cbd5e1" stroke="#475569" stroke-width="2"/><text x="480" y="271" font-family="Arial" font-size="12" fill="#334155">Front caster</text>
<!-- underside pad shown dashed -->
<rect x="310" y="525" width="320" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 5"/><text x="364" y="558" font-family="Arial" font-size="17" font-weight="bold" fill="#166534">Underside microfiber mop pad</text>
<!-- dimension lines -->
<path d="M190 664 H750 M190 655 V673 M750 655 V673" stroke="#334155" stroke-width="2"/><text x="411" y="692" font-family="Arial" font-size="16" fill="#14213d">280 mm width</text>
<path d="M140 135 V615 M131 135 H149 M131 615 H149" stroke="#334155" stroke-width="2"/><text x="65" y="390" font-family="Arial" font-size="16" fill="#14213d" transform="rotate(-90 65 390)">240 mm depth</text>
<text x="790" y="220" font-family="Arial" font-size="14" font-weight="bold" fill="#b91c1c">Design notes</text><text x="790" y="248" font-family="Arial" font-size="13" fill="#475569">• Keep electronics above</text><text x="805" y="267" font-family="Arial" font-size="13" fill="#475569">and isolated from wet zone.</text><text x="790" y="300" font-family="Arial" font-size="13" fill="#475569">• IR sensors must see floor</text><text x="805" y="319" font-family="Arial" font-size="13" fill="#475569">ahead of wheel contact.</text><text x="790" y="352" font-family="Arial" font-size="13" fill="#475569">• Pad must not obstruct</text><text x="805" y="371" font-family="Arial" font-size="13" fill="#475569">wheels or casters.</text><text x="790" y="410" font-family="Arial" font-size="13" fill="#475569">• Pump/tubing routing and</text><text x="805" y="429" font-family="Arial" font-size="13" fill="#475569">mounting holes depend on</text><text x="805" y="448" font-family="Arial" font-size="13" fill="#475569">selected components.</text><text x="790" y="505" font-family="Arial" font-size="14" font-weight="bold" fill="#b91c1c">Layout guide only.</text><text x="790" y="530" font-family="Arial" font-size="13" fill="#475569">Not a dimensioned CNC</text><text x="790" y="549" font-family="Arial" font-size="13" fill="#475569">fabrication drawing.</text>
</svg>
